title: "Portfolio BTS SIO — Yanis Haddou"
description: "Parcours de professionnalisation, réalisations et suivi de compétences — BTS SIO"
theme: jekyll-theme-cayman

plugins:
  - jekyll-optional-front-matter
  - jekyll-relative-links
  - jekyll-titles-from-headings

optional_front_matter:
  remove_originals: true

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
